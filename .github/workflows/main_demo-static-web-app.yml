name: Deploy static content to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # CHANGED: Removed MSBuild and NuGet steps. 
      # We simply upload the current folder (containing index.html) as the artifact.
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: web-app-content
          path: .
          # Optional: Exclude hidden git folders to keep deployment clean
          if-no-files-found: error

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: web-app-content
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          # Preserved your specific secrets
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F1DD721F7EDE473F99B65EB5971FEC0C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E7F18747850045E2BCE757DE6480C865 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3316AC3A66A44DAE84BEC74795FE3FA3 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'demo-static-web-app'
          slot-name: 'Production'
          package: .
